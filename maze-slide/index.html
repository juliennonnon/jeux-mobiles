<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Maze Slide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen arcade. HUD band, fitted maze stage, control band; the menu floats over a live self-solving demo maze. */
:root{
  --void:#07060e;
  --panel:rgba(19,16,34,.82);
  --line:rgba(176,166,255,.16);
  --ink:#eeebff;
  --mute:#9993c2;
  --accent:#ffd166;
  --alt:#ff7aa2;
  --gem:#7ff6ff;
  --gold:#ffd166;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#app{position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

.hud{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px}
.icon{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.icon svg{width:20px;height:20px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hud-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin-top:2px}
.inv{display:inline-flex;gap:6px}
.chip{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:0;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.gem{color:var(--gem)}
.chip.gem.on{background:var(--gem);color:#081418}
.chip.key.on{background:var(--gold);color:#1a1405}
.stat{text-align:right}
.stat-val{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--accent);margin-top:2px}
.stat-val small{font-size:13px;color:var(--mute);font-weight:500}
.timebar{height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--accent);box-shadow:0 0 12px var(--accent);transform-origin:left;transition:background .3s}
.timebar.low i{background:var(--alt);box-shadow:0 0 12px var(--alt)}

#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--accent);text-shadow:0 0 18px var(--accent);white-space:nowrap;animation:rise 1.1s ease-out forwards}
.float.bad{color:var(--alt);text-shadow:0 0 18px var(--alt)}
.float.info{font-family:var(--f-body);font-size:15px;font-weight:700;color:var(--ink);text-shadow:none;background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:12px;animation-duration:2.2s;white-space:normal;width:max-content;max-width:80%;text-align:center}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%)}}

.controls{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.ctl{height:54px;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;transition:transform .08s}
.ctl:active{transform:scale(.96)}
.ctl svg{width:18px;height:18px;flex:none}
.ctl:disabled{opacity:.35}

.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.menu{background:linear-gradient(180deg,rgba(7,6,14,.35),rgba(7,6,14,.78) 45%,rgba(7,6,14,.92))}
.dim{background:rgba(7,6,14,.6)}
.menu-inner{width:min(380px,100%);display:grid;gap:14px;align-self:end;padding-bottom:4vh}
.logo{margin:0 0 6px;font-family:var(--f-display);font-weight:800;font-size:clamp(52px,16vw,82px);line-height:.9;letter-spacing:-.03em}
.logo .o{color:transparent;-webkit-text-stroke:1.6px #cfc8ff;text-shadow:0 0 22px rgba(160,140,255,.45)}
.logo .f{display:block;color:#ffd166;text-shadow:0 0 26px rgba(255,209,102,.55)}
.tag{margin:0 0 6px;font-size:15px;line-height:1.5;color:#c9c4ea;max-width:34ch}
.mode{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;text-align:left;padding:18px;border-radius:20px;border:1px solid rgba(255,209,102,.35);background:var(--panel);transition:transform .08s}
.mode:active{transform:scale(.98)}
.mode.alt{border-color:rgba(255,122,162,.38)}
.mode-name{font-family:var(--f-display);font-weight:700;font-size:21px}
.mode-desc{grid-column:1;font-size:13px;color:var(--mute)}
.mode-meta{grid-column:2;grid-row:1 / span 2;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;background:rgba(255,209,102,.12);color:#ffd166;white-space:nowrap;font-variant-numeric:tabular-nums}
.mode.alt .mode-meta{background:rgba(255,122,162,.12);color:var(--alt)}
.sound{justify-self:center;background:none;border:0;color:var(--mute);font-size:13px;font-weight:600;padding:8px 12px}

.card{width:min(340px,100%);box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px 22px 20px;text-align:center;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;gap:12px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;text-wrap:balance}
.card p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.card #introText{color:#d6d1f5;font-size:15px}
#introCv{justify-self:center;width:180px;height:72px;max-width:100%}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--accent);text-shadow:0 0 24px var(--accent);font-variant-numeric:tabular-nums}
.stars{display:flex;justify-content:center;gap:10px}
.stars svg{width:44px;height:44px}
.stars .on{fill:var(--accent);filter:drop-shadow(0 0 8px var(--accent))}
.stars .off{fill:rgba(255,255,255,.1)}
.badge{justify-self:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.btn{height:50px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:#120f1f;border-color:transparent}
.btn.wide{grid-column:1 / -1}

@media (prefers-reduced-motion:reduce){.card,.float{animation-duration:.01s}}
</style>

<div id="app">
  <header class="hud" id="hud" hidden>
    <button class="icon" id="btnMenu" aria-label="Retour au menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div><div class="eyebrow" id="hudMode">Détente</div><div class="hud-title"><span id="hudTitle">Niveau 1</span><span class="inv" id="inv"></span></div></div>
    <div class="stat"><span class="eyebrow" id="statLabel">Coups / parfait</span><span class="stat-val" id="statVal">0</span></div>
  </header>
  <div class="timebar" id="timebar" hidden><i id="timefill"></i></div>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="floats"></div>
  </main>

  <footer class="controls" id="ctlRelax" hidden>
    <button class="ctl" id="btnUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Annuler</button>
    <button class="ctl" id="btnRestart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg>Recommencer</button>
    <button class="ctl" id="btnHint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0012 2z"/></svg>Indice</button>
  </footer>
  <footer class="controls" id="ctlChal" hidden>
    <button class="ctl" id="btnRestart2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg>Recommencer</button>
    <button class="ctl" id="btnSkip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>Passer · −10 s</button>
  </footer>

  <section class="overlay menu" id="menu">
    <div class="menu-inner">
      <h1 class="logo"><span class="o">Maze</span><span class="f">Slide</span></h1>
      <p class="tag">Glisse ton doigt : la bille file jusqu’au prochain mur. Gemmes, clés, portails et interrupteurs t’attendent en chemin.</p>
      <button class="mode" id="playRelax"><span class="mode-name">Détente</span><span class="mode-desc">Sans chrono, labyrinthes à l’infini</span><span class="mode-meta" id="relaxMeta">Niveau 1</span></button>
      <button class="mode alt" id="playChal"><span class="mode-name">Défi</span><span class="mode-desc">60 s, +6 s par labyrinthe, +3 s si parfait</span><span class="mode-meta" id="chalMeta">Record —</span></button>
      <button class="sound" id="btnSound">Son : activé</button>
    </div>
  </section>

  <section class="overlay dim" id="intro" hidden>
    <div class="card">
      <span class="badge">Nouveau</span>
      <canvas id="introCv" width="360" height="144"></canvas>
      <h2 id="introTitle">Gemmes</h2>
      <p id="introText"></p>
      <div class="row"><button class="btn primary wide" id="btnIntro">Compris</button></div>
    </div>
  </section>

  <section class="overlay dim" id="win" hidden>
    <div class="card">
      <span class="badge" id="winBadge">Chemin parfait</span>
      <h2 id="winTitle">Niveau 1 réussi</h2>
      <div class="stars" id="winStars"></div>
      <p id="winText">4 coups · parfait en 4</p>
      <div class="row"><button class="btn" id="btnReplay">Rejouer</button><button class="btn primary" id="btnNext">Suivant</button></div>
    </div>
  </section>

  <section class="overlay dim" id="over" hidden>
    <div class="card">
      <span class="badge" id="overBadge">Temps écoulé</span>
      <div class="big" id="overScore">0</div>
      <p id="overText">labyrinthes résolus</p>
      <p id="overRecord">Record : 0</p>
      <div class="row"><button class="btn" id="btnOverMenu">Menu</button><button class="btn primary" id="btnAgain">Rejouer</button></div>
    </div>
  </section>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let DPR = Math.min(window.devicePixelRatio || 1, 2.5);

/* ---------- sauvegarde locale ---------- */
const KEY = 'mazeslide_v1';
let save = { relax: 1, best: 0, bestPerfect: 0, stars: {}, sound: true, seen: [] };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
if (!Array.isArray(save.seen)) save.seen = [];
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

/* ---------- mécaniques ----------
   Masque d'état (5 bits) : 1 = clé prise, 2 = interrupteur basculé, 4/8/16 = gemmes ramassées */
const MECH = {
  coin:   { title:'Gemmes',        text:'Ramasse toutes les gemmes avant de t’arrêter sur la cible. Elle s’allume quand il n’en reste plus.' },
  key:    { title:'Clé et portes', text:'Passe sur la clé : toutes les portes dorées s’ouvrent pour le reste du niveau.' },
  portal: { title:'Portails',      text:'Entre dans un portail et tu ressors par son jumeau, dans la même direction.' },
  switch: { title:'Interrupteur',  text:'Chaque passage sur l’interrupteur inverse les barrières : les roses s’ouvrent quand les bleues se ferment, et l’inverse.' },
  arrow:  { title:'Flèches',       text:'En passant sur une flèche, la bille change de direction sans s’arrêter.' },
  stop:   { title:'Freins',        text:'La bille s’arrête net sur un frein, même sans mur devant elle.' }
};
const ORDER = ['coin','key','portal','switch','arrow','stop'];
const INTRO_AT = [4,7,11,15,19,23];
const COL = { gem:'#7ff6ff', gold:'#ffd166', A:'#ff5fa2', B:'#4fd8ff', P:['#b98cff','#7dffb0'] };

function rng(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DIRS = { up:[0,-1], right:[1,0], down:[0,1], left:[-1,0] };
const DLIST = [[0,-1],[1,0],[0,1],[-1,0]];
const DNAMES = ['up','right','down','left'];

function blocked(L,x,y,m){
  if (L.g[y][x]) return true;
  const o = L.obj[y*L.W+x];
  if (!o) return false;
  if (o.t === 'door') return !(m & 1);
  if (o.t === 'gateA') return !(m & 2);
  if (o.t === 'gateB') return !!(m & 2);
  return false;
}

/* Simule une glissade complète : renvoie le chemin cellule par cellule et les événements */
function sim(L,x,y,m,dx,dy){
  const W = L.W, path = [{x,y,dx,dy}], ev = [];
  let steps = 0;
  for (;;){
    const nx = x+dx, ny = y+dy;
    if (blocked(L,nx,ny,m)) break;
    x = nx; y = ny;
    if (++steps > 300) return null;
    path.push({x,y,dx,dy});
    const o = L.obj[y*W+x];
    if (!o) continue;
    const i = path.length-1;
    if (o.t === 'coin'){ if (!(m & o.bit)){ m |= o.bit; ev.push({i,m,t:'coin',x,y}); } }
    else if (o.t === 'key'){ if (!(m & 1)){ m |= 1; ev.push({i,m,t:'key',x,y}); } }
    else if (o.t === 'switch'){ m ^= 2; ev.push({i,m,t:'switch',x,y}); }
    else if (o.t === 'arrow'){ dx = o.d[0]; dy = o.d[1]; ev.push({i,m,t:'arrow',x,y}); }
    else if (o.t === 'stop'){ ev.push({i,m,t:'stop',x,y}); break; }
    else if (o.t === 'portal'){
      const tx = o.to % W, ty = (o.to / W) | 0;
      x = tx; y = ty; path.push({x,y,dx,dy,jump:true});
      ev.push({i:path.length-1,m,t:'portal',x,y,fx:path[i].x,fy:path[i].y});
    }
  }
  if (path.length === 1) return null;
  return { x, y, m, path, ev };
}

function search(L,sx,sy,m0,mark){
  const W = L.W, N = W*L.H*32;
  const dist = new Int16Array(N).fill(-1), prev = new Int32Array(N).fill(-1), pd = new Int8Array(N);
  const seen = mark ? new Uint8Array(W*L.H) : null;
  const s0 = ((sy*W+sx) << 5) | m0; dist[s0] = 0; const q = [s0];
  if (seen) seen[sy*W+sx] = 1;
  for (let qi = 0; qi < q.length; qi++){
    const st = q[qi], c = st >> 5, m = st & 31, x = c % W, y = (c / W) | 0;
    for (let d = 0; d < 4; d++){
      const r = sim(L,x,y,m,DLIST[d][0],DLIST[d][1]);
      if (!r) continue;
      if (seen) for (const p of r.path) seen[p.y*W+p.x] = 1;
      const ns = ((r.y*W+r.x) << 5) | r.m;
      if (dist[ns] < 0){ dist[ns] = dist[st]+1; prev[ns] = st; pd[ns] = d; q.push(ns); }
    }
  }
  return { dist, prev, pd, q, seen };
}

function goalState(L,S){
  const base = (L.gy*L.W+L.gx) << 5; let best = -1, bd = 1e9;
  for (let m = 0; m < 32; m++){ if ((m & L.allC) !== L.allC) continue; const d = S.dist[base|m]; if (d >= 0 && d < bd){ bd = d; best = base|m; } }
  return best < 0 ? null : { st:best, d:bd };
}

function solve(x,y,m){
  const S = search(L,x,y,m,false), G = goalState(L,S);
  if (!G) return null;
  const dirs = []; let st = G.st; const s0 = ((y*L.W+x) << 5) | m;
  while (st !== s0){ dirs.push(DNAMES[S.pd[st]]); st = S.prev[st]; }
  return dirs.reverse();
}

function params(diff, nm){
  const cols = Math.min(7 + Math.floor(diff/3) + (nm ? 1 : 0), 12);
  return { cols, rows: Math.min(Math.round(cols*1.45), 17), minPar: Math.min(3 + Math.floor(diff*0.6), 12), p: 0.25 + Math.min(diff,20)*0.003 - nm*0.015 };
}

function mechsFor(lv){
  const R = rng(lv*7919+3);
  const unlocked = ORDER.filter((m,i) => lv >= INTRO_AT[i]);
  if (!unlocked.length) return [];
  const ni = unlocked.length-1;
  if (lv < INTRO_AT[ni] + 3) return lv - INTRO_AT[ni] === 2 && ni > 0 ? [unlocked[ni], unlocked[(R()*ni)|0]] : [unlocked[ni]];
  if (R() < 0.12) return [];
  return pickN(unlocked, 1 + (R() < 0.5 ? 1 : 0) + (lv > 30 && R() < 0.3 ? 1 : 0), R);
}
function pickN(arr,n,R){ const a = arr.slice(), out = []; while (out.length < n && a.length) out.push(a.splice((R()*a.length)|0,1)[0]); return out; }

function generate(seed, diff, mechs){
  mechs = mechs || [];
  const P = params(diff, mechs.length), R = rng(seed);
  let best = null, bestScore = -1e9;
  const tries = mechs.length ? 420 : 320;
  for (let t = 0; t < tries; t++){
    const W = P.cols+2, H = P.rows+2, g = [];
    for (let y = 0; y < H; y++){ const row = []; for (let x = 0; x < W; x++) row.push((x===0||y===0||x===W-1||y===H-1||R()<P.p)?1:0); g.push(row); }
    const em = []; for (let y=1;y<H-1;y++) for (let x=1;x<W-1;x++) if(!g[y][x]) em.push(y*W+x);
    if (em.length < 10 + mechs.length*4) continue;
    for (let i = em.length-1; i > 0; i--){ const j = (R()*(i+1))|0; [em[i],em[j]] = [em[j],em[i]]; }
    const used = new Set();
    const isCorr = c => { const x = c % W, y = (c/W)|0; return (g[y][x-1] && g[y][x+1] && !g[y-1][x] && !g[y+1][x]) || (g[y-1][x] && g[y+1][x] && !g[y][x-1] && !g[y][x+1]); };
    const pick = corr => { if (corr) for (const c of em) if (!used.has(c) && isCorr(c)){ used.add(c); return c; } for (const c of em) if (!used.has(c)){ used.add(c); return c; } return -1; };
    const s = pick(false), obj = {}; let allC = 0;
    for (const mk of mechs){
      if (mk === 'coin'){ const n = 2 + (R() < 0.5 ? 1 : 0); for (let i = 0; i < n; i++){ const c = pick(false); obj[c] = { t:'coin', bit:4<<i }; allC |= 4<<i; } }
      else if (mk === 'key'){ obj[pick(false)] = { t:'key' }; const n = 1 + ((R()*2)|0); for (let i = 0; i < n; i++) obj[pick(true)] = { t:'door' }; }
      else if (mk === 'portal'){ const a = pick(false), b = pick(false); obj[a] = { t:'portal', to:b, pair:0 }; obj[b] = { t:'portal', to:a, pair:0 }; }
      else if (mk === 'switch'){ obj[pick(false)] = { t:'switch' }; const na = 1 + ((R()*2)|0), nb = 1 + ((R()*2)|0); for (let i = 0; i < na; i++) obj[pick(true)] = { t:'gateA' }; for (let i = 0; i < nb; i++) obj[pick(true)] = { t:'gateB' }; }
      else if (mk === 'arrow'){ const n = 1 + ((R()*2)|0); for (let i = 0; i < n; i++){ const c = pick(false), x = c % W, y = (c/W)|0; const ok = DLIST.filter(([dx,dy]) => !g[y+dy][x+dx]); const d = ok.length ? ok[(R()*ok.length)|0] : DLIST[0]; obj[c] = { t:'arrow', d }; } }
      else if (mk === 'stop'){ const n = 1 + ((R()*2)|0); for (let i = 0; i < n; i++) obj[pick(false)] = { t:'stop' }; }
    }
    const sx = s % W, sy = (s/W)|0, Lc = { g, W, H, obj, allC };
    const S = search(Lc, sx, sy, 0, false);
    // cible : la case d'arrêt (toutes gemmes prises) la plus lointaine
    const cellMin = new Map();
    for (const st of S.q){ const c = st >> 5, m = st & 31; if (c === s || obj[c] || (m & allC) !== allC || cellMin.has(c)) continue; cellMin.set(c, S.dist[st]); }
    if (!cellMin.size) continue;
    let md = -1; for (const d of cellMin.values()) md = Math.max(md, d);
    const cands = [...cellMin].filter(([,d]) => d === md).map(([c]) => c);
    const gc = cands[(R()*cands.length)|0];
    Object.assign(Lc, { sx, sy, gx: gc % W, gy: (gc/W)|0, par: md });
    // chaque mécanique doit compter
    let ok = true;
    const without = types => { const o2 = {}; for (const k in obj) if (!types.includes(obj[k].t)) o2[k] = obj[k]; const L2 = Object.assign({}, Lc, { obj:o2 }); const G = goalState(L2, search(L2, sx, sy, 0, false)); return G ? G.d : -1; };
    if (mechs.includes('key') && without(['key']) >= 0) ok = false;
    if (ok && mechs.includes('switch') && without(['switch']) >= 0) ok = false;
    if (ok && mechs.includes('portal')){ const d = without(['portal']); if (d >= 0 && d < md + 2) ok = false; }
    if (ok && mechs.includes('arrow') && without(['arrow']) === md) ok = false;
    if (ok && mechs.includes('stop') && without(['stop']) === md) ok = false;
    let sc = -Math.abs(md - (P.minPar+1)) + Math.min(S.q.length, 60)*0.01;
    if (!ok) sc -= 50;
    if (sc > bestScore){ bestScore = sc; best = Lc; }
    if (ok && md >= P.minPar && md <= P.minPar + 4) { best = Lc; break; }
  }
  return finalize(best);
}

/* Murs pour tout ce que la bille ne traverse jamais, puis recadrage */
function finalize(L){
  const { g,W,H } = L, seen = search(L, L.sx, L.sy, 0, true).seen;
  let x1=W,x2=0,y1=H,y2=0;
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){ if(!seen[y*W+x]) g[y][x]=1; else { x1=Math.min(x1,x);x2=Math.max(x2,x);y1=Math.min(y1,y);y2=Math.max(y2,y); } }
  const NW = x2-x1+3, NH = y2-y1+3, ng = [];
  for (let y=y1-1;y<=y2+1;y++){ const r=[]; for (let x=x1-1;x<=x2+1;x++) r.push(g[y][x]); ng.push(r); }
  const f = c => ((((c/W)|0) - y1 + 1) * NW) + (c % W - x1 + 1);
  const obj = {}, types = new Set();
  for (const k in L.obj){ const c = +k; if (!seen[c]) continue; const o = Object.assign({}, L.obj[k]); if (o.t === 'portal') o.to = f(o.to); obj[f(c)] = o;
    types.add(o.t === 'door' ? 'key' : o.t === 'gateA' || o.t === 'gateB' ? 'switch' : o.t); }
  return { g:ng, W:NW, H:NH, obj, allC:L.allC, types:ORDER.filter(t => types.has(t)),
    sx:L.sx-x1+1, sy:L.sy-y1+1, gx:L.gx-x1+1, gy:L.gy-y1+1, par:L.par };
}

/* ---------- état ---------- */
const THEMES = [[265,45],[190,330],[320,165],[155,35],[225,15],[290,95],[200,48],[340,190]];
let L = null, mode = 'demo', level = 1;
let ball = { x:0, y:0, fx:0, fy:0, moving:false, dx:0, dy:0, squash:0 };
let anim = null, gm = 0, vm = 0;
let moves = 0, history = [], queued = null, locked = false, appear = 0;
let trail = [], parts = [], shake = 0, hint = null, stops = [], introQueue = [];
let timeLeft = 60, solved = 0, perfects = 0, demoTimer = 0, demoPlan = [];
let hue = 265, bhue = 45;

function loadLevel(lv){
  L = lv; ball.x = ball.fx = L.sx; ball.y = ball.fy = L.sy; ball.moving = false; ball.squash = 0; anim = null; gm = vm = 0;
  moves = 0; history = []; queued = null; trail = []; hint = null; stops = [[L.sx,L.sy]]; appear = 0; locked = false;
  fitBoard(); hud();
}
function setTheme(i){
  [hue,bhue] = THEMES[((i % THEMES.length) + THEMES.length) % THEMES.length];
  document.documentElement.style.setProperty('--accent', `hsl(${bhue},100%,68%)`);
}

/* ---------- mise en page ---------- */
const lay = { cell:0, ox:0, oy:0, cw:0, ch:0 };
const wallCv = document.createElement('canvas'), wctx = wallCv.getContext('2d');
let glowCv = document.createElement('canvas');

function layout(){
  const r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  lay.cw = r.width; lay.ch = r.height;
  cv.width = Math.max(1, Math.round(r.width*DPR)); cv.height = Math.max(1, Math.round(r.height*DPR));
  if (L) fitBoard();
}
function fitBoard(){
  if (!lay.cw || !L) return;
  lay.cell = Math.max(4, Math.min(lay.cw / L.W, lay.ch / L.H));
  if (mode === 'demo') lay.cell = Math.min(lay.cell, lay.ch*0.6 / L.H * 1.1);
  lay.ox = (lay.cw - lay.cell*L.W)/2;
  lay.oy = mode === 'demo' ? Math.max(8, lay.ch*0.04) : (lay.ch - lay.cell*L.H)/2;
  buildWalls(); buildGlow();
}

function buildWalls(){
  wallCv.width = cv.width; wallCv.height = cv.height;
  const c = wctx, s = lay.cell, ox = lay.ox, oy = lay.oy, { g,W,H } = L;
  c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,lay.cw,lay.ch);
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (!g[y][x]){
    c.fillStyle = `hsla(${hue},60%,50%,0.045)`; c.fillRect(ox+x*s, oy+y*s, s, s);
    if (!L.obj[y*W+x]){ c.fillStyle = `hsla(${hue},70%,75%,0.16)`; c.beginPath(); c.arc(ox+(x+.5)*s, oy+(y+.5)*s, Math.max(1,s*0.035), 0, 7); c.fill(); }
  }
  c.fillStyle = `hsla(${hue},70%,42%,0.16)`;
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (g[y][x]){
    let near = false;
    for (let j=-1;j<=1&&!near;j++) for (let i=-1;i<=1;i++){ const yy=y+j, xx=x+i; if (yy>=0&&yy<H&&xx>=0&&xx<W&&!g[yy][xx]) { near=true; break; } }
    if (near) c.fillRect(ox+x*s, oy+y*s, s, s);
  }
  c.beginPath();
  for (let y=1;y<H-1;y++) for (let x=1;x<W-1;x++) if (!g[y][x]){
    const X=ox+x*s, Y=oy+y*s;
    if (g[y-1][x]) { c.moveTo(X,Y); c.lineTo(X+s,Y); }
    if (g[y+1][x]) { c.moveTo(X,Y+s); c.lineTo(X+s,Y+s); }
    if (g[y][x-1]) { c.moveTo(X,Y); c.lineTo(X,Y+s); }
    if (g[y][x+1]) { c.moveTo(X+s,Y); c.lineTo(X+s,Y+s); }
  }
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.shadowColor = `hsl(${hue},100%,60%)`; c.strokeStyle = `hsla(${hue},100%,62%,0.85)`;
  c.lineWidth = Math.max(2, s*0.1); c.shadowBlur = s*0.7; c.stroke();
  c.shadowBlur = s*0.25; c.stroke();
  c.shadowBlur = 0; c.strokeStyle = `hsl(${hue},100%,90%)`; c.lineWidth = Math.max(1, s*0.035); c.stroke();
}

function buildGlow(){
  const r = lay.cell*0.32, R = Math.ceil(r*3.2);
  glowCv.width = glowCv.height = Math.ceil(R*2*DPR);
  const c = glowCv.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0);
  const gr = c.createRadialGradient(R,R,0,R,R,R);
  gr.addColorStop(0, `hsla(${bhue},100%,70%,0.55)`); gr.addColorStop(0.35, `hsla(${bhue},100%,60%,0.18)`); gr.addColorStop(1, `hsla(${bhue},100%,60%,0)`);
  c.fillStyle = gr; c.fillRect(0,0,R*2,R*2);
  glowCv._R = R;
}

const cx = x => lay.ox + (x+.5)*lay.cell, cy = y => lay.oy + (y+.5)*lay.cell;

/* ---------- dessin des objets ---------- */
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function drawObj(c,o,X,Y,s,m,now){
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  switch (o.t){
    case 'coin': {
      if (m & o.bit) break;
      const r = s*0.2*(1 + 0.08*Math.sin(now/220 + o.bit)), yy = Y + Math.sin(now/400 + o.bit)*s*0.04;
      c.shadowColor = COL.gem; c.shadowBlur = s*0.5; c.fillStyle = COL.gem;
      c.beginPath(); c.moveTo(X, yy-r*1.3); c.lineTo(X+r, yy); c.lineTo(X, yy+r*1.3); c.lineTo(X-r, yy); c.closePath(); c.fill();
      c.shadowBlur = 0; c.fillStyle = 'rgba(255,255,255,.75)';
      c.beginPath(); c.moveTo(X, yy-r*1.3); c.lineTo(X+r*0.45, yy-r*0.2); c.lineTo(X, yy); c.lineTo(X-r*0.45, yy-r*0.2); c.closePath(); c.fill();
      break;
    }
    case 'key': {
      if (m & 1) break;
      const yy = Y + Math.sin(now/380)*s*0.04;
      c.translate(X, yy); c.rotate(-0.5);
      c.strokeStyle = COL.gold; c.shadowColor = COL.gold; c.shadowBlur = s*0.45; c.lineWidth = Math.max(1.5, s*0.075);
      c.beginPath(); c.arc(-s*0.14, 0, s*0.11, 0, 7); c.stroke();
      c.beginPath(); c.moveTo(-s*0.03, 0); c.lineTo(s*0.25, 0); c.moveTo(s*0.15, 0); c.lineTo(s*0.15, s*0.1); c.moveTo(s*0.24, 0); c.lineTo(s*0.24, s*0.08); c.stroke();
      break;
    }
    case 'door': {
      const i = s*0.08, x0 = X-s/2+i, y0 = Y-s/2+i, w = s-2*i;
      if (m & 1){ c.setLineDash([s*0.08, s*0.08]); c.strokeStyle = 'rgba(255,209,102,.35)'; c.lineWidth = Math.max(1, s*0.04); rrect(c,x0,y0,w,w,s*0.1); c.stroke(); break; }
      c.fillStyle = 'rgba(255,209,102,.2)'; rrect(c,x0,y0,w,w,s*0.1); c.fill();
      c.strokeStyle = COL.gold; c.shadowColor = COL.gold; c.shadowBlur = s*0.35; c.lineWidth = Math.max(1.5, s*0.06); c.stroke();
      c.shadowBlur = 0; c.fillStyle = COL.gold;
      c.beginPath(); c.arc(X, Y-s*0.05, s*0.07, 0, 7); c.fill();
      c.beginPath(); c.moveTo(X-s*0.05, Y+s*0.16); c.lineTo(X+s*0.05, Y+s*0.16); c.lineTo(X, Y-s*0.02); c.closePath(); c.fill();
      break;
    }
    case 'gateA': case 'gateB': {
      const col = o.t === 'gateA' ? COL.A : COL.B, closed = o.t === 'gateA' ? !(m & 2) : !!(m & 2);
      const i = s*0.08, x0 = X-s/2+i, y0 = Y-s/2+i, w = s-2*i;
      if (!closed){ c.setLineDash([s*0.06, s*0.09]); c.globalAlpha = 0.45; c.strokeStyle = col; c.lineWidth = Math.max(1, s*0.04); rrect(c,x0,y0,w,w,s*0.1); c.stroke(); break; }
      rrect(c,x0,y0,w,w,s*0.1); c.save(); c.clip();
      c.fillStyle = col; c.globalAlpha = 0.22; c.fillRect(x0,y0,w,w); c.globalAlpha = 0.7;
      c.strokeStyle = col; c.lineWidth = Math.max(1, s*0.05);
      for (let k = -3; k <= 3; k++){ c.beginPath(); c.moveTo(X + k*s*0.2 - s, Y + s); c.lineTo(X + k*s*0.2 + s, Y - s); c.stroke(); }
      c.restore();
      c.strokeStyle = col; c.shadowColor = col; c.shadowBlur = s*0.4; c.lineWidth = Math.max(1.5, s*0.06); rrect(c,x0,y0,w,w,s*0.1); c.stroke();
      break;
    }
    case 'switch': {
      const on = !!(m & 2), r = s*0.3;
      c.fillStyle = 'rgba(255,255,255,.06)'; c.beginPath(); c.arc(X, Y, r, 0, 7); c.fill();
      c.translate(X, Y); c.rotate(on ? Math.PI : 0);
      c.shadowBlur = s*0.35;
      c.fillStyle = COL.A; c.shadowColor = COL.A; c.beginPath(); c.arc(0, 0, r*0.62, Math.PI/2, Math.PI*1.5); c.fill();
      c.fillStyle = COL.B; c.shadowColor = COL.B; c.beginPath(); c.arc(0, 0, r*0.62, -Math.PI/2, Math.PI/2); c.fill();
      c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = Math.max(1.2, s*0.045);
      c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(-r*0.32, 0, r*0.16, 0, 7); c.fill();
      break;
    }
    case 'portal': {
      const col = COL.P[o.pair||0], a = now/500;
      const gr = c.createRadialGradient(X,Y,0,X,Y,s*0.42); gr.addColorStop(0, col+'88'); gr.addColorStop(1, col+'00');
      c.fillStyle = gr; c.beginPath(); c.arc(X, Y, s*0.42, 0, 7); c.fill();
      c.strokeStyle = col; c.shadowColor = col; c.shadowBlur = s*0.4; c.lineWidth = Math.max(1.5, s*0.06);
      for (let k = 0; k < 3; k++){ c.beginPath(); c.arc(X, Y, s*0.34, a + k*2.09, a + k*2.09 + 1.3); c.stroke(); }
      c.lineWidth = Math.max(1, s*0.04);
      for (let k = 0; k < 2; k++){ c.beginPath(); c.arc(X, Y, s*0.2, -a*1.6 + k*3.14, -a*1.6 + k*3.14 + 1.8); c.stroke(); }
      break;
    }
    case 'arrow': {
      c.translate(X, Y); c.rotate(Math.atan2(o.d[1], o.d[0]));
      const ph = (now/600) % 1;
      c.strokeStyle = `hsl(${hue},100%,88%)`; c.shadowColor = `hsl(${hue},100%,65%)`; c.shadowBlur = s*0.3; c.lineWidth = Math.max(1.5, s*0.07);
      for (let k = 0; k < 2; k++){ const ox = -s*0.12 + k*s*0.2; c.globalAlpha = 0.45 + 0.55*((k + ph) % 1 > 0.5 ? 1 : 0.6);
        c.beginPath(); c.moveTo(ox - s*0.09, -s*0.15); c.lineTo(ox + s*0.06, 0); c.lineTo(ox - s*0.09, s*0.15); c.stroke(); }
      break;
    }
    case 'stop': {
      const i = s*0.2, w = s-2*i, x0 = X-s/2+i, y0 = Y-s/2+i;
      c.fillStyle = `hsla(${hue},60%,80%,0.14)`; rrect(c,x0,y0,w,w,s*0.06); c.fill();
      c.strokeStyle = `hsl(${hue},40%,88%)`; c.lineWidth = Math.max(1.2, s*0.05); c.stroke();
      c.lineWidth = Math.max(1.5, s*0.07); c.beginPath(); c.moveTo(X - s*0.12, Y); c.lineTo(X + s*0.12, Y); c.stroke();
      break;
    }
  }
  c.restore();
}

/* ---------- son ---------- */
let ac = null;
function audio(){
  if (!save.sound || mode === 'demo') return null;
  if (!ac){ try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, d=0.08, type='sine', v=0.07, delay=0){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), gn = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f,t);
  gn.gain.setValueAtTime(0.0001,t); gn.gain.exponentialRampToValueAtTime(v,t+0.01); gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t+d+0.03);
}
const buzz = ms => { try { if (mode!=='demo' && navigator.vibrate) navigator.vibrate(ms); } catch(e){} };

/* ---------- déplacements ---------- */
function move(dir){
  if (!L || locked) return;
  if (ball.moving){ queued = dir; return; }
  const [dx,dy] = DIRS[dir], r = sim(L, ball.x, ball.y, gm, dx, dy);
  if (!r){ ball.dx = dx; ball.dy = dy; ball.squash = 0.5; tone(120,0.05,'square',0.02); return; }
  history.push({ x:ball.x, y:ball.y, m:gm }); moves++; hint = null;
  anim = { path:r.path, ev:r.ev, evi:0, t:0, dur:0.06 + (r.path.length-1)*0.042 };
  ball.moving = true; ball.dx = dx; ball.dy = dy; ball.x = r.x; ball.y = r.y; gm = r.m;
  tone(520,0.04,'sine',0.025);
  hud();
}

function applyEvent(e){
  vm = e.m;
  const X = cx(e.x), Y = cy(e.y);
  if (e.t === 'coin'){ burst(X, Y, 0, 0, reduced ? 6 : 18, COL.gem, 2); tone(1175,0.1,'sine',0.06); tone(1568,0.12,'sine',0.05,0.05); buzz(10); }
  else if (e.t === 'key'){ burst(X, Y, 0, 0, reduced ? 6 : 22, COL.gold, 2); [784,988,1319].forEach((f,i) => tone(f,0.12,'triangle',0.06,i*0.05)); buzz(15); floatInfo('Portes ouvertes'); }
  else if (e.t === 'switch'){ burst(X, Y, 0, 0, reduced ? 4 : 12, (e.m & 2) ? COL.A : COL.B, 2); tone(260,0.08,'square',0.04); tone(390,0.08,'square',0.04,0.05); buzz(12); if (!reduced) shake = Math.min(lay.cell*0.1, 4); }
  else if (e.t === 'portal'){ burst(cx(e.fx), cy(e.fy), 0, 0, reduced ? 4 : 14, COL.P[0], 2); burst(X, Y, 0, 0, reduced ? 4 : 14, COL.P[0], 2); tone(660,0.15,'sine',0.05); tone(990,0.12,'sine',0.04,0.06); trail.push({ x:X, y:Y, age:0, brk:true }); }
  else if (e.t === 'arrow'){ tone(880,0.04,'triangle',0.03); }
  else if (e.t === 'stop'){ tone(160,0.08,'triangle',0.06); }
  invUpdate();
}

function arrive(){
  const last = anim.path[anim.path.length-1];
  ball.moving = false; ball.fx = last.x; ball.fy = last.y; ball.dx = last.dx; ball.dy = last.dy; ball.squash = 1;
  while (anim.evi < anim.ev.length) applyEvent(anim.ev[anim.evi++]);
  vm = gm; anim = null;
  stops.push([ball.x, ball.y]);
  const px = cx(ball.fx) + ball.dx*lay.cell*0.34, py = cy(ball.fy) + ball.dy*lay.cell*0.34;
  burst(px, py, -ball.dx, -ball.dy, reduced ? 4 : 10, `hsl(${hue},100%,75%)`, 0.9);
  if (!reduced) shake = Math.max(shake, Math.min(lay.cell*0.12, 5));
  tone(240, 0.1, 'triangle', 0.08); buzz(8);
  invUpdate();
  if (ball.x === L.gx && ball.y === L.gy && (gm & L.allC) === L.allC) return win();
  if (queued){ const q = queued; queued = null; move(q); }
}

function burst(x,y,dx,dy,n,color,spread=2){
  for (let i=0;i<n;i++){
    const a = Math.atan2(dy,dx) + (Math.random()-.5)*Math.PI*spread, sp = (40+Math.random()*140)*(lay.cell/40);
    parts.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0, max:0.35+Math.random()*0.4, color, size:Math.max(1.2, lay.cell*(0.04+Math.random()*0.05)) });
  }
}

function win(){
  locked = true; queued = null;
  burst(cx(L.gx), cy(L.gy), 0, 0, reduced ? 12 : 46, `hsl(${bhue},100%,72%)`, 2);
  burst(cx(L.gx), cy(L.gy), 0, 0, reduced ? 6 : 22, '#ffffff', 2);
  const perfect = moves <= L.par;
  if (mode === 'demo'){ demoTimer = 1.4; return; }
  [523,659,784,1047].forEach((f,i) => tone(f, 0.18, 'sine', 0.07, i*0.07)); buzz([20,40,30]);
  if (mode === 'relax'){
    const st = perfect ? 3 : moves <= L.par+2 ? 2 : 1;
    save.stars[level] = Math.max(save.stars[level]||0, st);
    save.relax = Math.max(save.relax, level+1); persist();
    setTimeout(() => showWin(st, perfect), 650);
  } else {
    solved++; if (perfect) perfects++;
    const bonus = 6 + (perfect ? 3 : 0); timeLeft += bonus;
    floatMsg(perfect ? `Parfait  +${bonus} s` : `+${bonus} s`);
    setTimeout(() => { if (mode === 'challenge') nextChallenge(); }, 600);
  }
}

/* ---------- modes ---------- */
function startRelax(lv){
  mode = 'relax'; level = lv; setTheme(lv-1); showUI();
  loadLevel(generate(lv*1013+7, lv-1, mechsFor(lv)));
  introQueue = L.types.filter(t => !save.seen.includes(t));
  if (introQueue.length) showIntro();
}
function startChallenge(){
  mode = 'challenge'; solved = 0; perfects = 0; timeLeft = 60; showUI();
  nextChallenge();
}
function nextChallenge(){
  setTheme(solved);
  const R = Math.random, n = solved;
  const mechs = n < 2 ? [] : pickN(ORDER, 1 + (n >= 6 && R() < 0.4 ? 1 : 0), R);
  loadLevel(generate((R()*1e9)|0, Math.min(2+solved, 15), mechs));
}
function startDemo(){
  mode = 'demo'; showUI();
  setTheme((Math.random()*THEMES.length)|0);
  const mechs = Math.random() < 0.75 ? [ORDER[(Math.random()*ORDER.length)|0]] : [];
  loadLevel(generate((Math.random()*1e9)|0, 5, mechs));
  demoPlan = solve(ball.x, ball.y, gm) || []; demoTimer = 0.8;
}
function endChallenge(){
  locked = true; mode = 'over';
  const rec = solved > save.best;
  if (rec){ save.best = solved; } save.bestPerfect = Math.max(save.bestPerfect, perfects); persist();
  $('overScore').textContent = solved;
  $('overText').textContent = (solved > 1 ? 'labyrinthes résolus' : 'labyrinthe résolu') + (perfects ? ` · ${perfects} parfait${perfects>1?'s':''}` : '');
  $('overBadge').textContent = rec && solved > 0 ? 'Nouveau record' : 'Temps écoulé';
  $('overRecord').textContent = `Record : ${save.best}`;
  $('over').hidden = false;
  tone(330,0.25,'triangle',0.07); tone(220,0.35,'triangle',0.07,0.15);
}

function showIntro(){
  const t = introQueue[0], M = MECH[t];
  locked = true;
  $('introTitle').textContent = M.title; $('introText').textContent = M.text;
  $('intro').hidden = false;
  drawIntro(t, performance.now());
}
const INTRO_SCENE = {
  coin:[{t:'coin',bit:4},{t:'coin',bit:8},{t:'coin',bit:16}],
  key:[{t:'key'},{t:'door'},{t:'door'}],
  portal:[{t:'portal',pair:0},null,{t:'portal',pair:0}],
  switch:[{t:'gateA'},{t:'switch'},{t:'gateB'}],
  arrow:[{t:'arrow',d:[1,0]},{t:'arrow',d:[0,1]},{t:'arrow',d:[-1,0]}],
  stop:[null,{t:'stop'},null]
};
function drawIntro(t, now){
  const c = $('introCv').getContext('2d'), s = 96, W = 360, H = 144;
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,W,H);
  INTRO_SCENE[t].forEach((o,i) => {
    const X = 36 + s*0.5 + i*s, Y = H/2;
    c.fillStyle = `hsla(${hue},60%,60%,0.08)`; rrect(c, X-s/2+4, Y-s/2+4, s-8, s-8, 14); c.fill();
    if (o) drawObj(c, o, X, Y, s, 0, now);
  });
}

function showUI(){
  const inGame = mode === 'relax' || mode === 'challenge';
  $('menu').hidden = mode !== 'demo';
  $('hud').hidden = !inGame;
  $('timebar').hidden = mode !== 'challenge';
  $('ctlRelax').hidden = mode !== 'relax';
  $('ctlChal').hidden = mode !== 'challenge';
  $('win').hidden = true; $('over').hidden = true; $('intro').hidden = true;
  $('floats').innerHTML = '';
  if (mode === 'demo') refreshMenu();
  requestAnimationFrame(layout);
}
function refreshMenu(){
  $('relaxMeta').textContent = save.relax > 1 ? `Niveau ${save.relax}` : 'Niveau 1';
  $('chalMeta').textContent = save.best ? `Record ${save.best}` : 'Record —';
  $('btnSound').textContent = save.sound ? 'Son : activé' : 'Son : coupé';
}
function hud(){
  if (mode === 'relax'){
    $('hudMode').textContent = 'Détente';
    $('hudTitle').textContent = `Niveau ${level}`;
    $('statLabel').textContent = 'Coups / parfait';
    $('statVal').innerHTML = `${moves}<small> / ${L.par}</small>`;
    $('btnUndo').disabled = history.length === 0;
  } else if (mode === 'challenge'){
    $('hudMode').textContent = 'Défi';
    $('hudTitle').textContent = `${solved} résolu${solved>1?'s':''}`;
    $('statLabel').textContent = 'Temps';
  }
  invUpdate();
}
function invUpdate(){
  if (!L || mode === 'demo') return;
  let h = '';
  if (L.allC){
    let tot = 0, got = 0; for (let b = 4; b <= 16; b <<= 1) if (L.allC & b){ tot++; if (vm & b) got++; }
    h += `<span class="chip gem${got === tot ? ' on' : ''}">◆ ${got}/${tot}</span>`;
  }
  if (L.types.includes('key')) h += `<span class="chip key${vm & 1 ? ' on' : ''}">${vm & 1 ? 'Clé ✓' : 'Clé'}</span>`;
  const el = $('inv'); if (el.innerHTML !== h) el.innerHTML = h;
}
function showWin(st, perfect){
  $('winTitle').textContent = `Niveau ${level} réussi`;
  $('winBadge').textContent = perfect ? 'Chemin parfait' : st === 2 ? 'Presque parfait' : 'Réussi';
  $('winText').textContent = `${moves} coup${moves>1?'s':''} · parfait en ${L.par}`;
  const star = on => `<svg viewBox="0 0 24 24" class="${on?'on':'off'}"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>`;
  $('winStars').innerHTML = [1,2,3].map(i => star(i <= st)).join('');
  $('win').hidden = false;
}
function floatMsg(text, cls=''){
  const d = document.createElement('div'); d.className = 'float ' + cls; d.textContent = text;
  $('floats').appendChild(d); setTimeout(() => d.remove(), 2300);
}
function floatInfo(text){ if (mode !== 'demo') floatMsg(text, 'info'); }

function undo(){
  if (locked || ball.moving || !history.length) return;
  const h = history.pop(); ball.x = ball.fx = h.x; ball.y = ball.fy = h.y; gm = vm = h.m; moves = Math.max(0, moves-1);
  stops.pop(); trail = []; hint = null; tone(380,0.05,'sine',0.03); hud();
}
function restart(){
  if (locked || ball.moving) return;
  ball.x = ball.fx = L.sx; ball.y = ball.fy = L.sy; gm = vm = 0; moves = 0; history = []; trail = []; hint = null; stops = [[L.sx,L.sy]];
  tone(300,0.06,'sine',0.03); hud();
}
function showHint(){
  if (locked || ball.moving) return;
  const plan = solve(ball.x, ball.y, gm);
  if (!plan){ floatMsg('Plus de chemin d’ici : annule ou recommence', 'info'); return; }
  const [dx,dy] = DIRS[plan[0]], r = sim(L, ball.x, ball.y, gm, dx, dy);
  hint = { path: r ? r.path : [], t: 0 };
}

/* ---------- rendu ---------- */
const LAYER_FLOOR = { door:1, gateA:1, gateB:1, stop:1, arrow:1, portal:1, switch:1 };
function render(now){
  const W = lay.cw, H = lay.ch;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if (!L) return;
  const sx = shake ? (Math.random()-.5)*shake : 0, sy = shake ? (Math.random()-.5)*shake : 0;
  ctx.save(); ctx.translate(sx, sy);
  const a = Math.min(1, appear);
  ctx.globalAlpha = a;
  ctx.drawImage(wallCv, 0, 0, W, H);
  const s = lay.cell, r = s*0.32;

  // objets au sol puis objets à ramasser
  for (const pass of [1,0]) for (const k in L.obj){
    const o = L.obj[k]; if ((LAYER_FLOOR[o.t] ? 1 : 0) !== pass) continue;
    const c = +k; drawObj(ctx, o, cx(c % L.W), cy((c / L.W) | 0), s, vm, now);
  }
  ctx.globalAlpha = a;

  // cible (éteinte tant qu'il reste des gemmes)
  const gx = cx(L.gx), gy = cy(L.gy), open = (vm & L.allC) === L.allC, pulse = open ? 0.5 + 0.5*Math.sin(now/260) : 0;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = open ? `hsla(${bhue},100%,70%,${0.5+0.4*pulse})` : 'rgba(200,195,230,.35)'; ctx.lineWidth = Math.max(1.5, s*0.06);
  ctx.shadowColor = `hsl(${bhue},100%,65%)`; ctx.shadowBlur = open ? s*0.4 : 0;
  ctx.beginPath(); ctx.arc(gx, gy, r*1.05 + pulse*s*0.04, 0, 7); ctx.stroke();
  if (open){
    ctx.setLineDash([s*0.09, s*0.11]); ctx.lineDashOffset = -now/40; ctx.lineWidth = Math.max(1, s*0.03);
    ctx.beginPath(); ctx.arc(gx, gy, r*1.45, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.shadowBlur = 0; ctx.fillStyle = `hsla(${bhue},100%,80%,0.35)`; ctx.beginPath(); ctx.arc(gx, gy, r*0.32, 0, 7); ctx.fill();
  }
  ctx.restore();
  if (!open){
    let left = 0; for (let b = 4; b <= 16; b <<= 1) if ((L.allC & b) && !(vm & b)) left++;
    ctx.fillStyle = COL.gem; ctx.font = `700 ${Math.max(9, s*0.32)}px Manrope, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(left, gx, gy + 1);
  }

  // points d'arrêt de la tentative
  ctx.fillStyle = `hsla(${bhue},100%,75%,0.22)`;
  for (const [x,y] of stops){ if (L.obj[y*L.W+x]) continue; ctx.beginPath(); ctx.arc(cx(x), cy(y), Math.max(1.5, s*0.07), 0, 7); ctx.fill(); }

  // indice
  if (hint){
    ctx.save(); ctx.strokeStyle = `hsla(${bhue},100%,80%,${0.9 - 0.3*Math.sin(now/120)})`; ctx.lineWidth = Math.max(2, s*0.08); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    hint.path.forEach((p,k) => {
      if (k === 0) return;
      const px = cx(p.x), py = cy(p.y), w = s*0.16, dx = p.dx, dy = p.dy;
      ctx.globalAlpha = a * Math.max(0, Math.min(1, hint.t*4 - k*0.25));
      ctx.beginPath();
      ctx.moveTo(px - dx*w - dy*w, py - dy*w - dx*w); ctx.lineTo(px + dx*w, py + dy*w); ctx.lineTo(px - dx*w + dy*w, py - dy*w + dx*w);
      ctx.stroke();
    });
    ctx.restore();
  }

  // traînée
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (let i = 1; i < trail.length; i++){
    const p0 = trail[i-1], p1 = trail[i], life = 1 - p1.age / TRAIL;
    if (life <= 0 || p1.brk) continue;
    ctx.strokeStyle = `hsla(${bhue},100%,${60 + 20*life}%,${0.75*life})`;
    ctx.lineWidth = r * 1.5 * (0.25 + 0.75*life);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
  }
  for (const p of parts){
    const l = 1 - p.life/p.max; ctx.globalAlpha = a * l; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(0.5+l*0.5), 0, 7); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha = a;

  // bille
  const bx = cx(ball.fx), by = cy(ball.fy), R = glowCv._R;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(glowCv, bx-R, by-R, R*2, R*2); ctx.restore();
  ctx.save(); ctx.translate(bx, by);
  const q = ball.squash;
  if (q > 0){ ctx.rotate(Math.atan2(ball.dy, ball.dx)); ctx.scale(1 - 0.28*q, 1 + 0.18*q); }
  const gr = ctx.createRadialGradient(-r*0.3, -r*0.35, r*0.1, 0, 0, r);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.35, `hsl(${bhue},100%,78%)`); gr.addColorStop(1, `hsl(${bhue},95%,52%)`);
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  if (vm & 1 && L.types.includes('key')){ ctx.fillStyle = COL.gold; ctx.beginPath(); ctx.arc(r*0.55, -r*0.55, r*0.22, 0, 7); ctx.fill(); }
  ctx.restore();
  ctx.restore();
}

/* ---------- boucle ---------- */
const TRAIL = 0.55;
let last = performance.now();
function update(dt, now){
  if (!$('intro').hidden) drawIntro(introQueue[0], now);
  if (!L) return;
  appear += dt*4;
  if (anim){
    anim.t += dt / anim.dur;
    const P = anim.path, n = P.length, t = Math.min(1, anim.t), e = t < 1 ? 1 - Math.pow(1-t, 2.3) : 1;
    const f = e*(n-1), i = Math.min(Math.floor(f), n-2), fr = f - i, A = P[i], B = P[i+1];
    if (B.jump){ const p = fr < 0.5 ? A : B; ball.fx = p.x; ball.fy = p.y; }
    else { ball.fx = A.x + (B.x - A.x)*fr; ball.fy = A.y + (B.y - A.y)*fr; }
    while (anim.evi < anim.ev.length && f >= anim.ev[anim.evi].i - 0.5) applyEvent(anim.ev[anim.evi++]);
    trail.push({ x:cx(ball.fx), y:cy(ball.fy), age:0 });
    if (t >= 1) arrive();
  }
  ball.squash = Math.max(0, ball.squash - dt*7);
  for (const p of trail) p.age += dt;
  while (trail.length && trail[0].age > TRAIL) trail.shift();
  for (const p of parts){ p.life += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.9; p.vy *= 0.9; }
  parts = parts.filter(p => p.life < p.max);
  shake = Math.max(0, shake - dt*30);
  if (hint) hint.t += dt;

  if (mode === 'challenge' && !document.hidden){
    timeLeft -= dt;
    const v = Math.max(0, timeLeft);
    $('statVal').textContent = v.toFixed(1).replace('.', ',');
    $('timefill').style.transform = `scaleX(${Math.min(1, v/60)})`;
    $('timebar').classList.toggle('low', v < 10);
    if (timeLeft <= 0) endChallenge();
  }
  if (mode === 'demo'){
    demoTimer -= dt;
    if (demoTimer <= 0){
      if (locked) { startDemo(); return; }
      if (!ball.moving){
        const d = demoPlan.shift();
        if (d) move(d); else { demoPlan = solve(ball.x, ball.y, gm) || []; if (!demoPlan.length) startDemo(); }
        demoTimer = 0.55;
      }
    }
  }
}
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt, now); render(now);
  requestAnimationFrame(frame);
}

/* ---------- entrées ---------- */
let sw = null;
const playing = () => (mode === 'relax' || mode === 'challenge') && $('win').hidden && $('over').hidden && $('intro').hidden;
window.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; sw = { x:e.clientX, y:e.clientY, used:false }; });
window.addEventListener('pointermove', e => {
  if (!sw || sw.used) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.hypot(dx, dy) > 22){
    sw.used = true;
    if (playing()) move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }
});
['pointerup','pointercancel'].forEach(ev => window.addEventListener(ev, () => { sw = null; }));
window.addEventListener('keydown', e => {
  const k = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right' }[e.key];
  if (k && playing()){ e.preventDefault(); move(k); }
  else if ((e.key === 'z' || e.key === 'Backspace') && mode === 'relax') undo();
  else if (e.key === 'r' && playing()) restart();
});

$('playRelax').onclick = () => { audio(); startRelax(save.relax); };
$('playChal').onclick = () => { audio(); startChallenge(); };
$('btnSound').onclick = () => { save.sound = !save.sound; persist(); refreshMenu(); };
$('btnMenu').onclick = () => startDemo();
$('btnUndo').onclick = undo;
$('btnRestart').onclick = restart;
$('btnRestart2').onclick = restart;
$('btnHint').onclick = showHint;
$('btnSkip').onclick = () => { if (locked) return; timeLeft -= 10; floatMsg('−10 s', 'bad'); if (timeLeft > 0) nextChallenge(); };
$('btnNext').onclick = () => startRelax(level + 1);
$('btnReplay').onclick = () => { $('win').hidden = true; locked = false; restart(); };
$('btnAgain').onclick = () => startChallenge();
$('btnOverMenu').onclick = () => startDemo();
$('btnIntro').onclick = () => {
  const t = introQueue.shift(); if (t && !save.seen.includes(t)){ save.seen.push(t); persist(); }
  if (introQueue.length) showIntro(); else { $('intro').hidden = true; locked = false; }
};

new ResizeObserver(layout).observe(stage);
layout();
startDemo();
requestAnimationFrame(t => { last = t; frame(t); });

})();
</script>

</body></html>
