<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Néon Tri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Lexend:wght@400;600;800&display=swap">
<style>
/* Layout: one-screen arcade — HUD on top, word card in the middle aimed at three neon targets, tap buttons at the bottom */
:root{
  --bg:#07060f; --panel:#110e20; --ink:#eef0ff; --dim:#8a87a6;
  --nom:#2ef2ff; --verbe:#ff3fb4; --adj:#ffe14d; --ok:#5dff9a; --bad:#ff4d5e;
  --display:"Monoton","Lexend",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;box-sizing:border-box;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;position:relative}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-variant-numeric:tabular-nums}
.score{font-size:28px;font-weight:800;letter-spacing:.02em}
.score small{display:block;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.mult{font-weight:800;font-size:20px;color:var(--adj);text-shadow:0 0 12px var(--adj);min-width:52px;text-align:center;transition:transform .15s}
.mult.pop{transform:scale(1.5)}
.lives{display:flex;gap:8px;justify-content:flex-end}
.life{width:14px;height:14px;border-radius:50%;background:var(--verbe);box-shadow:0 0 10px var(--verbe);transition:opacity .3s,transform .3s}
.life.off{opacity:.15;box-shadow:none;transform:scale(.7)}

.stage{flex:1;position:relative;touch-action:none;min-height:0}
.target{position:absolute;font-weight:800;letter-spacing:.18em;font-size:15px;opacity:.55;transition:opacity .15s,text-shadow .15s}
.target.hot{opacity:1}
.t-adj{top:6px;left:50%;transform:translateX(-50%);color:var(--adj)}
.t-nom{left:0;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;color:var(--nom)}
.t-verbe{right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;color:var(--verbe)}
.target.hot.t-adj{text-shadow:0 0 14px var(--adj)}
.target.hot.t-nom{text-shadow:0 0 14px var(--nom)}
.target.hot.t-verbe{text-shadow:0 0 14px var(--verbe)}

.card{position:absolute;left:50%;top:50%;width:min(70%,300px);box-sizing:border-box;padding:28px 18px 18px;border-radius:18px;
  background:var(--panel);border:2px solid var(--ink);box-shadow:0 0 18px rgba(238,240,255,.25),inset 0 0 18px rgba(238,240,255,.06);
  transform:translate(-50%,-50%);text-align:center;cursor:grab;will-change:transform}
.card.anim{transition:transform .22s ease-in,opacity .22s,border-color .15s,box-shadow .15s}
.word{font-size:clamp(28px,8vw,42px);font-weight:800;line-height:1.1;overflow-wrap:anywhere;min-height:1.1em}
.hint{margin-top:8px;font-size:13px;color:var(--dim);min-height:1.3em}
.timer{margin-top:16px;height:6px;border-radius:3px;background:rgba(238,240,255,.08);overflow:hidden}
.timer i{display:block;height:100%;background:var(--ink);transform-origin:left;box-shadow:0 0 8px var(--ink)}
.card.good-nom{border-color:var(--nom);box-shadow:0 0 30px var(--nom)}
.card.good-verbe{border-color:var(--verbe);box-shadow:0 0 30px var(--verbe)}
.card.good-adj{border-color:var(--adj);box-shadow:0 0 30px var(--adj)}
.card.bad{border-color:var(--bad);box-shadow:0 0 30px var(--bad);animation:shake .35s}
@keyframes shake{0%,100%{margin-left:0}20%{margin-left:-12px}40%{margin-left:10px}60%{margin-left:-7px}80%{margin-left:4px}}

.pads{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pad{font:inherit;font-weight:800;font-size:15px;padding:16px 6px;border-radius:14px;background:transparent;color:var(--c);border:2px solid var(--c);
  box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent);cursor:pointer;letter-spacing:.04em}
.pad:active{background:color-mix(in srgb,var(--c) 22%,transparent)}
.pad:focus-visible,.go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.p-nom{--c:var(--nom)} .p-adj{--c:var(--adj)} .p-verbe{--c:var(--verbe)}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  background:rgba(7,6,15,.92);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(46px,15vw,76px);line-height:1;color:var(--ink);
  text-shadow:0 0 6px var(--nom),0 0 18px var(--nom),0 0 40px var(--verbe);margin:0}
.rules{max-width:34ch;line-height:1.55;color:var(--dim);margin:0}
.rules b{font-weight:800}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:14px;letter-spacing:.06em}
.go{font:inherit;font-weight:800;font-size:20px;padding:14px 44px;border-radius:999px;border:2px solid var(--ok);color:var(--ok);background:transparent;
  box-shadow:0 0 18px var(--ok);cursor:pointer;letter-spacing:.08em}
.big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;margin:0;line-height:1}
.best{color:var(--adj);font-weight:600}
@media (prefers-reduced-motion:reduce){.card.anim{transition:none}.card.bad{animation:none}}
</style>

<div class="app">
  <div class="hud">
    <div class="score"><small>Score</small><span id="score">0</span></div>
    <div class="mult" id="mult">×1</div>
    <div class="lives" id="lives"><span class="life"></span><span class="life"></span><span class="life"></span></div>
  </div>

  <div class="stage" id="stage">
    <div class="target t-adj" id="t-adj">ADJECTIF</div>
    <div class="target t-nom" id="t-nom">NOM</div>
    <div class="target t-verbe" id="t-verbe">VERBE</div>
    <div class="card" id="card">
      <div class="word" id="word">château</div>
      <div class="hint" id="hint">Glisse vers la bonne case</div>
      <div class="timer"><i id="bar"></i></div>
    </div>
  </div>

  <div class="pads">
    <button class="pad p-nom" data-k="nom" id="b-nom">← Nom</button>
    <button class="pad p-adj" data-k="adj" id="b-adj">↑ Adjectif</button>
    <button class="pad p-verbe" data-k="verbe" id="b-verbe">Verbe →</button>
  </div>

  <div class="overlay" id="overlay">
    <h1 class="logo">Néon Tri</h1>
    <p class="rules">Un mot apparaît. Glisse-le vers sa nature avant la fin du chrono. Enchaîne les bonnes réponses pour monter le multiplicateur.</p>
    <div class="legend"><span style="color:var(--nom)">← NOM</span><span style="color:var(--adj)">↑ ADJECTIF</span><span style="color:var(--verbe)">VERBE →</span></div>
    <p class="best" id="bestStart"></p>
    <button class="go" id="go">Jouer</button>
  </div>
</div>

<script>
const WORDS = {
  nom: ["maison","chien","forêt","nuage","crayon","montagne","rivière","voiture","jardin","oiseau","fenêtre","bonheur","courage","château","étoile","horloge","cartable","bateau","cerise","tempête","pinceau","village","lumière","poisson","musique","école","dragon","volcan","tortue","gâteau","boussole","silence","récréation","bibliothèque","papillon"],
  verbe: ["courir","manger","chanter","dessiner","il mange","nous jouons","ils partent","finir","prendre","sauter","écrire","elle dort","vous lisez","grandir","peindre","tu cours","regarder","construire","ils chantent","je dessine","nager","elle découvre","nous rions","apprendre","tu choisis","ils grimpent","voler","je comprends","réfléchir","vous dansez"],
  adj: ["rapide","grand","petite","joyeux","brillant","froide","verte","doux","courageux","immense","timide","sombre","léger","gentille","bruyant","fragile","curieux","ancien","minuscule","lumineuse","délicieux","paresseux","étrange","pointu","silencieuse","fier","mouillé","énorme","drôle","patiente"]
};
const NAMES = {nom:"un NOM", verbe:"un VERBE", adj:"un ADJECTIF"};
const POOL = []; for (const k in WORDS) for (const w of WORDS[k]) POOL.push({w,k});

const $ = id => document.getElementById(id);
const card=$("card"), word=$("word"), hint=$("hint"), bar=$("bar"), stage=$("stage");
let score, lives, streak, mult, solved, cur, last, limit, start, running=false, locked=true, raf, ac;
let best = 0; try { best = +localStorage.getItem("neonTriBest") || 0; } catch(e){}
$("bestStart").textContent = best ? "Record : " + best : "";

function tone(f,d,type="triangle",v=.07){ if(!ac) return; const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(v,ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+d); }

function hud(){
  $("score").textContent=score; $("mult").textContent="×"+mult;
  [...$("lives").children].forEach((l,i)=>l.classList.toggle("off", i>=lives));
}
function resetCard(){
  card.classList.remove("anim","good-nom","good-verbe","good-adj","bad");
  card.style.transform="translate(-50%,-50%)"; card.style.opacity=1; void card.offsetWidth;
}
function next(){
  if(!running) return;
  resetCard();
  do { cur = POOL[Math.floor(Math.random()*POOL.length)]; } while (cur===last); last=cur;
  word.textContent=cur.w; hint.textContent="";
  limit = Math.max(1.4, 3.8 - solved*0.07);
  start = performance.now(); locked=false;
  cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}
function loop(now){
  if(!running || locked) return;
  const frac = 1 - (now-start)/1000/limit;
  bar.style.transform = `scaleX(${Math.max(0,frac)})`;
  if (frac <= 0) return fail(null);
  raf = requestAnimationFrame(loop);
}
function answer(k){
  if(!running || locked) return;
  locked = true;
  k===cur.k ? good(k) : fail(k);
}
function good(k){
  const frac = Math.max(0, 1-(performance.now()-start)/1000/limit);
  streak++; solved++;
  const nm = Math.min(5, 1+Math.floor(streak/5));
  if (nm>mult){ const m=$("mult"); m.classList.add("pop"); setTimeout(()=>m.classList.remove("pop"),180); tone(880,.25,"square",.05); }
  mult = nm;
  score += (10 + Math.round(frac*10)) * mult;
  hud();
  tone(440 + Math.min(streak,20)*25, .12);
  const d = {nom:"translate(-180%,-50%)", verbe:"translate(80%,-50%)", adj:"translate(-50%,-220%)"}[k];
  card.classList.add("anim","good-"+k); card.style.transform=d; card.style.opacity=0;
  setTimeout(next, 230);
}
function fail(k){
  locked = true; streak=0; mult=1; lives--;
  hud(); tone(150,.35,"sawtooth",.05);
  resetCard(); card.classList.add("bad");
  hint.innerHTML = (k ? "Raté ! " : "Trop lent ! ") + `C'était <b style="color:var(--${cur.k})">${NAMES[cur.k]}</b>`;
  bar.style.transform="scaleX(0)";
  setTimeout(()=> lives<=0 ? over() : next(), 1100);
}
function over(){
  running=false;
  const rec = score > best; if (rec){ best=score; try{ localStorage.setItem("neonTriBest", best); }catch(e){} }
  const o=$("overlay");
  o.innerHTML = `<p class="rules">Partie terminée</p><p class="big">${score}</p>
    <p class="best">${rec ? "Nouveau record !" : "Record : "+best}</p>
    <p class="rules">${solved} mot${solved>1?"s":""} bien triés</p><button class="go" id="go">Rejouer</button>`;
  o.hidden=false; $("go").onclick=play; $("go").focus();
}
function play(){
  try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); } catch(e){}
  score=0; lives=3; streak=0; mult=1; solved=0; last=null; running=true;
  hud(); $("overlay").hidden=true; next();
}
$("go").onclick = play;
document.querySelectorAll(".pad").forEach(b => b.onclick = () => answer(b.dataset.k));
addEventListener("keydown", e => {
  const k = {ArrowLeft:"nom", ArrowRight:"verbe", ArrowUp:"adj"}[e.key];
  if (k){ e.preventDefault(); answer(k); }
});

// Swipe
let sx=0, sy=0, drag=false;
const dirOf = (dx,dy) => (dy<-50 && -dy>Math.abs(dx)) ? "adj" : dx<-50 ? "nom" : dx>50 ? "verbe" : null;
function light(k){ ["nom","verbe","adj"].forEach(t=>$("t-"+t).classList.toggle("hot", t===k)); }
stage.addEventListener("pointerdown", e => { if(locked) return; drag=true; sx=e.clientX; sy=e.clientY; stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", e => {
  if(!drag) return;
  const dx=e.clientX-sx, dy=Math.min(0,e.clientY-sy)*1;
  card.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${dx/18}deg)`;
  light(dirOf(dx,dy));
});
stage.addEventListener("pointerup", e => {
  if(!drag) return; drag=false; light(null);
  const k = dirOf(e.clientX-sx, e.clientY-sy);
  if (k) answer(k); else { card.classList.add("anim"); card.style.transform="translate(-50%,-50%)"; setTimeout(()=>card.classList.remove("anim"),230); }
});
stage.addEventListener("pointercancel", () => { drag=false; light(null); card.style.transform="translate(-50%,-50%)"; });
hud();
</script>

</body></html>
