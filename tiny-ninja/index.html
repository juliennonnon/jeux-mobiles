<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tiny Ninja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one full-screen canvas, flat night silhouettes; DOM overlays for HUD and menus */
:root{
  --sky:#1b2350;
  --ink:#06081a;
  --moon:#f3e6c4;
  --red:#d9483b;
  --dim:#8d93bd;
  --font:"Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--moon);font-family:var(--font)}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;pointer-events:none;font-size:18px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#hud .best{color:var(--dim);font-size:13px;align-self:center}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.panel h1{margin:0;font-size:clamp(34px,10vw,64px);font-weight:700;letter-spacing:.04em;line-height:1;text-wrap:balance}
.panel h1 span{color:var(--red)}
.panel p{margin:0;font-size:13px;color:var(--dim);letter-spacing:.08em;line-height:1.7;text-transform:uppercase}
.panel .tap{color:var(--moon);font-size:15px;margin-top:10px;animation:blink 1.1s steps(2) infinite}
.panel .big{font-size:clamp(40px,12vw,72px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.panel .new{color:var(--red);font-size:14px;letter-spacing:.1em}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.panel .tap{animation:none}}
</style>

<canvas id="c" aria-label="Tiny Ninja, jeu de course sur les toits"></canvas>
<div id="hud" hidden><div id="score">0</div><div class="best" id="bestHud"></div></div>

<div class="panel" id="title">
  <h1>TINY<br><span>NINJA</span></h1>
  <p>Appui court · petit saut<br>Maintenir · grand saut<br>Tombe sur un garde pour l'écraser</p>
  <div class="tap">Touchez pour courir</div>
</div>

<div class="panel" id="over" hidden>
  <p>Distance</p>
  <div class="big" id="final">0</div>
  <div class="new" id="newBest" hidden>Nouveau record</div>
  <p id="bestLine"></p>
  <div class="tap" id="retry">Touchez pour rejouer</div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const C={sky:'#1b2350',far:'#242d62',mid:'#151b42',ink:'#06081a',rim:'#3a4690',moon:'#f3e6c4',red:'#d9483b',win:'#f1c76a'};

let W=400,H=360,scale=1,dpr=1,GY=230,PX=90;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);
  scale=Math.min(cv.height/360,cv.width/340);
  W=cv.width/scale;H=cv.height/scale;
  GY=Math.round(Math.max(H*0.6,H-150));
  PX=Math.round(Math.min(W*0.24,130));
}
addEventListener('resize',resize);resize();

// ---- tuning
const G=2400,JV=640,HOLD_G=0.33,HOLD_MAX=0.26,COYOTE=0.09,BUFFER=0.12;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let best=0;try{best=+localStorage.getItem('tinyninja-best')||0}catch(e){}

let state='title',t=0,dist=0,speed=230,bonus=0,shake=0,deadAt=0;
let roofs=[],spikes=[],enemies=[],parts=[];
const P={y:0,vy:0,ground:true,hold:false,jumping:false,holdT:0,coy:0,buf:0,run:0};

function reset(){
  t=0;dist=0;speed=230;bonus=0;shake=0;parts=[];spikes=[];enemies=[];
  roofs=[{x:-200,y:GY,w:W+420,seed:1}];
  Object.assign(P,{y:GY,vy:0,ground:true,jumping:false,holdT:0,coy:0,buf:0,run:0});
  while(roofs[roofs.length-1].x<W+600)addRoof();
}

function addRoof(){
  const last=roofs[roofs.length-1],s=speed,d=clamp(t/70,0,1);
  let y=Math.round(clamp(last.y+rand(-50,50),GY-60,GY+55));
  let gap=Math.random()<0.12?0:rand(s*0.18,s*(0.42+0.16*d));
  if(gap===0)y=last.y+Math.round(rand(-30,25));
  if(y<last.y-20)gap=Math.min(gap,s*0.42);
  const w=Math.round(rand(170,430)-d*50);
  const r={x:last.x+last.w+gap,y,w,seed:Math.random()*1e4|0};
  roofs.push(r);
  // hazards
  const space=Math.max(120,s*0.8);
  let x=r.x+Math.max(70,s*0.5);
  while(x<r.x+r.w-60){
    if(Math.random()<0.35+0.4*d){
      if(Math.random()<0.3+0.25*d){
        enemies.push({x:x+8,y:r.y,min:r.x+6,max:r.x+r.w-6,vx:-rand(25,50+40*d),dead:0,f:0});
      }else{
        const n=1+(Math.random()*(1+2*d)|0);
        spikes.push({x,y:r.y,w:n*9});
      }
      x+=space;
    }else x+=space*0.6;
  }
}

function burst(x,y,col,n,sp=220){
  for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-sp,sp),vy:rand(-sp*1.4,sp*0.2),life:rand(.4,.8),col,s:rand(2,4)});
}

function die(){
  if(state!=='play')return;
  state='dead';deadAt=performance.now();shake=10;
  burst(PX+dist,P.y-12,C.moon,22);burst(PX+dist,P.y-12,C.red,10);
  const sc=score();
  const isBest=sc>best;if(isBest){best=sc;try{localStorage.setItem('tinyninja-best',best)}catch(e){}}
  $('final').textContent=sc;$('newBest').hidden=!isBest;$('bestLine').textContent='Record · '+best;
  setTimeout(()=>{if(state==='dead'){$('over').hidden=false;$('hud').hidden=true}},450);
}
const score=()=>Math.floor(dist/10)+bonus;

// ---- input
function press(){
  if(state==='title'){state='play';$('title').hidden=true;$('hud').hidden=false;reset();P.hold=true;return}
  if(state==='dead'){if(performance.now()-deadAt>650){$('over').hidden=true;$('hud').hidden=false;state='play';reset();P.hold=true}return}
  P.hold=true;P.buf=BUFFER;
}
function release(){P.hold=false;P.jumping=false}
cv.addEventListener('pointerdown',e=>{e.preventDefault();press()});
addEventListener('pointerup',release);addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();press()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')release()});
addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('.panel').forEach(p=>{p.style.pointerEvents='none'});

// ---- update
function update(dt){
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=1400*dt}
  parts=parts.filter(p=>p.life>0);
  shake=Math.max(0,shake-dt*40);
  if(state!=='play'){if(state==='title')dist+=60*dt;return}

  t+=dt;speed=230+Math.min(330,t*6.5);
  dist+=speed*dt;P.run+=dt*speed/22;
  P.buf-=dt;P.coy-=dt;

  if(P.buf>0&&(P.ground||P.coy>0)){
    P.vy=-JV;P.ground=false;P.jumping=true;P.holdT=0;P.buf=0;P.coy=0;
    burst(PX+dist,P.y,C.rim,4,80);
  }
  const g=(P.hold&&P.jumping&&P.holdT<HOLD_MAX&&P.vy<0)?G*HOLD_G:G;
  P.holdT+=dt;
  const prevY=P.y;P.vy+=g*dt;P.y+=P.vy*dt;

  const wx=PX+dist,wasGround=P.ground;P.ground=false;
  for(const r of roofs){
    if(wx+6>r.x&&wx-6<r.x+r.w){
      if(P.vy>=0&&prevY<=r.y+0.5&&P.y>=r.y){P.y=r.y;P.vy=0;P.ground=true;P.jumping=false}
      else if(P.y>r.y+6&&wx+6-r.x<14)return die(); // hit the wall of a higher roof
    }
  }
  if(wasGround&&!P.ground&&P.vy>=0)P.coy=COYOTE;
  if(P.y-24>H)return die();

  // spikes
  for(const s of spikes){
    if(wx+5>s.x+2&&wx-5<s.x+s.w-2&&P.y>s.y-8)return die();
  }
  // enemies
  for(const e of enemies){
    if(e.dead){e.dead+=dt;continue}
    e.x+=e.vx*dt;if(e.x<e.min||e.x>e.max){e.vx*=-1;e.x=clamp(e.x,e.min,e.max)}
    e.f+=dt*6;
    if(Math.abs(wx-e.x)<12&&P.y>e.y-18&&P.y-22<e.y){
      if(P.vy>0&&prevY<=e.y-12){
        e.dead=0.001;P.vy=-520;P.jumping=true;P.holdT=0.08;bonus+=25;
        burst(e.x,e.y-8,C.red,14);shake=4;
      }else return die();
    }
  }
  // recycle
  while(roofs[roofs.length-1].x<dist+W+600)addRoof();
  roofs=roofs.filter(r=>r.x+r.w>dist-200);
  spikes=spikes.filter(s=>s.x>dist-200);
  enemies=enemies.filter(e=>e.x>dist-200&&e.dead<1);
  $('score').textContent=score();
}

// ---- drawing helpers
function hash(n){n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n)}
const stars=Array.from({length:70},(_,i)=>({x:hash(i+1),y:hash(i+50),s:hash(i+99)>0.85?2:1,p:hash(i+7)*6}));

function skyline(par,col,minH,maxH,bw,base,lit){
  const off=dist*par,start=Math.floor(off/bw)-1;
  ctx.fillStyle=col;
  for(let i=start;i<start+W/bw+3;i++){
    const h=minH+hash(i*3.7+par*100)*(maxH-minH),w=bw*(0.6+hash(i*1.3+par)*0.45);
    const x=i*bw-off;
    ctx.fillRect(x,base-h,w,H-base+h);
    if(lit&&hash(i*9.1)>0.55){
      ctx.fillStyle='rgba(241,199,106,.18)';
      for(let k=0;k<3;k++)if(hash(i*5+k)>0.5)ctx.fillRect(x+6+k*9,base-h+10+hash(i+k)*20,3,4);
      ctx.fillStyle=col;
    }
  }
}

function drawNinja(x,y){
  const air=!P.ground&&state==='play',f=Math.floor(P.run)%2;
  const scarfWave=Math.sin(performance.now()/90)*2;
  // scarf
  ctx.fillStyle=C.red;
  ctx.fillRect(x-11,y-21+scarfWave*0.3,7,2);
  ctx.fillRect(x-17,y-20+scarfWave,6,2);
  // head + body
  ctx.fillStyle=C.moon;
  ctx.fillRect(x-4,y-24,9,8);
  ctx.fillRect(x-5,y-16,10,9);
  // eye slit
  ctx.fillStyle=C.ink;ctx.fillRect(x,y-21,5,2);
  ctx.fillStyle=C.moon;
  if(air){ctx.fillRect(x-4,y-7,4,4);ctx.fillRect(x+1,y-8,4,3)}
  else if(f){ctx.fillRect(x-5,y-7,3,7);ctx.fillRect(x+2,y-7,3,4);ctx.fillRect(x+3,y-4,3,4)}
  else{ctx.fillRect(x+1,y-7,3,7);ctx.fillRect(x-4,y-7,3,4);ctx.fillRect(x-6,y-4,3,4)}
}

function drawEnemy(e){
  const x=Math.round(e.x-dist),y=e.y;
  if(e.dead){ctx.globalAlpha=Math.max(0,1-e.dead*2);ctx.fillStyle=C.red;ctx.fillRect(x-7,y-4,14,4);ctx.globalAlpha=1;return}
  const b=Math.floor(e.f)%2;
  ctx.fillStyle=C.red;
  ctx.fillRect(x-6,y-18+b,12,15);
  ctx.fillRect(b?x-6:x-3,y-3,3,3);ctx.fillRect(b?x+3:x+1,y-3,3,3);
  ctx.fillStyle=C.moon;
  ctx.fillRect(e.vx<0?x-4:x+1,y-14+b,3,2);
}

function draw(){
  const sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.fillStyle=C.sky;ctx.fillRect(0,0,W,H);
  ctx.translate(sx,sy);
  // stars
  const now=performance.now()/1000;
  for(const s of stars){
    const x=((s.x*W*1.4-dist*0.02)%(W*1.4)+W*1.4)%(W*1.4),y=s.y*(GY-80);
    ctx.globalAlpha=0.35+0.4*Math.abs(Math.sin(now*0.8+s.p));
    ctx.fillStyle=C.moon;ctx.fillRect(x,y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  // moon
  const mx=W*0.76,my=Math.min(H*0.2,GY-140),mr=30;
  ctx.fillStyle='rgba(243,230,196,.06)';ctx.beginPath();ctx.arc(mx,my,mr*2.2,0,7);ctx.fill();
  ctx.fillStyle=C.moon;ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();
  ctx.fillStyle=C.sky;ctx.beginPath();ctx.arc(mx-13,my-7,mr*0.95,0,7);ctx.fill();
  // skylines
  skyline(0.15,C.far,50,120,70,GY+20,false);
  skyline(0.4,C.mid,20,80,55,GY+40,true);

  // roofs
  for(const r of roofs){
    const x=Math.round(r.x-dist);if(x>W||x+r.w<0)continue;
    ctx.fillStyle=C.ink;ctx.fillRect(x,r.y,r.w,H-r.y+20);
    ctx.fillStyle=C.rim;ctx.fillRect(x,r.y,r.w,2);
    // lit windows
    for(let k=0;k<r.w/34;k++){
      const h=hash(r.seed+k);
      if(h>0.72){ctx.fillStyle=h>0.9?C.win:'rgba(241,199,106,.35)';ctx.fillRect(x+10+k*34,r.y+26+hash(r.seed*2+k)*60,6,8)}
    }
  }
  // spikes
  for(const s of spikes){
    const x=Math.round(s.x-dist);if(x>W||x+s.w<0)continue;
    ctx.fillStyle=C.ink;ctx.beginPath();
    for(let k=0;k<s.w/9;k++){ctx.moveTo(x+k*9,s.y);ctx.lineTo(x+k*9+4.5,s.y-10);ctx.lineTo(x+k*9+9,s.y)}
    ctx.fill();
    ctx.fillStyle=C.rim;
    for(let k=0;k<s.w/9;k++)ctx.fillRect(x+k*9+4,s.y-10,1,2);
  }
  for(const e of enemies)drawEnemy(e);

  if(state!=='dead')drawNinja(PX,Math.round(state==='title'?GY:P.y));

  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x-dist,p.y,p.s,p.s)}
  ctx.globalAlpha=1;
}

// title idle scene
roofs=[{x:-200,y:GY,w:99999,seed:3}];
function syncBest(){$('bestHud').textContent=best?'REC '+best:''}
syncBest();

let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(state==='title'){P.run+=dt*8;P.ground=true;P.y=GY;roofs[0].y=GY}
  update(dt);draw();
  if(state==='play')syncBest();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

</body></html>
